<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-label="Vanakkam architecture: browser, server route handlers, YouCam API">
<style>
  .h{font:800 22px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:3px;fill:#f6ece4}
  .s{font:italic 17px Georgia,serif;fill:#d8b06a}
  .n{font:15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#cdb8b2}
  .lbl{font:700 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#ffffff;paint-order:stroke;stroke:#1a0d11;stroke-width:3px}
  .tag{font:800 12px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:2px}
  .t{font:400 38px Georgia,serif;fill:#f6ece4}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes dash{to{stroke-dashoffset:-48}}
  .bob{animation:bob 4s ease-in-out infinite}

  .wire{animation:dash 1.4s linear infinite}
</style>
<defs><pattern id="k" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.2" fill="#f6ece4" opacity=".07"/></pattern>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#160c10"/><stop offset="1" stop-color="#2a1018"/></linearGradient></defs>
<rect width="1280" height="920" rx="24" fill="url(#bg)"/><rect width="1280" height="920" rx="24" fill="url(#k)"/>
